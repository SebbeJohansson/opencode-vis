<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" type="image/png" href="./favicon.svg" />
    <title>Vis - OpenCode Visualizer</title>
    <script>
      // Inline blocking script: apply theme background before first paint to avoid FOUC.
      (function() {
        var PREFIX = 'opencode.';
        var THEME_KEY = PREFIX + 'settings.theme.v1';
        var SEEDS_KEY = PREFIX + 'settings.customThemeSeeds.v1';
        var BG_MAP = {
          dark: '#111a2c',
          light: '#f1f5f9',
          dracula: '#343746',
          'solarized-dark': '#073642'
        };
        var bg = BG_MAP.dark; // default fallback
        try {
          var id = localStorage.getItem(THEME_KEY);
          if (id === 'custom') {
            var seeds = JSON.parse(localStorage.getItem(SEEDS_KEY) || '{}');
            if (seeds.background) bg = seeds.background;
          } else if (id && BG_MAP[id]) {
            bg = BG_MAP[id];
          }
        } catch (e) {}
        document.documentElement.style.setProperty('--theme-bg-surface', bg);
      })();
    </script>
    <script type="module" src="./main.ts"></script>
    <style>
      html,
      body,
      #app {
        padding: 0;
        margin: 0;
        width: 100%;
        height: 100%;
        background: var(--theme-bg-surface, #111a2c);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
